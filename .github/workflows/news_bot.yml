name: Advanced Telegram News Bot Engine

on:
  schedule:
    # প্রতি ২ ঘণ্টা পর পর অটোমেটিক নিউজ পাঠাবে (Cron Time UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # হাতে চাপ দিয়ে ম্যানুয়ালি টেস্ট করার অপশন

jobs:
  run-telecom-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Canvas Graphic Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev pango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install NPM Modules
        run: npm install

      - name: Execute News Scraper & Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node bot.js
